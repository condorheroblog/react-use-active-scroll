<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- React-style cyan gradient -->
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" />
      <stop offset="100%" stop-color="#00B8D9" />
    </linearGradient>
    <!-- Active highlight gradient -->
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" />
      <stop offset="100%" stop-color="#00B8D9" />
    </linearGradient>
    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" />

  <!-- React atom orbits (3 ellipses) - simplified -->
  <g transform="translate(100 100)" opacity="0.25" fill="none" stroke="#61DAFB" stroke-width="1.5">
    <ellipse rx="70" ry="25" />
    <ellipse rx="70" ry="25" transform="rotate(60)" />
    <ellipse rx="70" ry="25" transform="rotate(120)" />
  </g>

  <!-- Center nucleus -->
  <circle cx="100" cy="100" r="6" fill="#61DAFB" />

  <!-- Scroll container / document card -->
  <g filter="url(#shadow)">
    <rect x="65" y="45" width="70" height="110" rx="6" fill="#ffffff" />
  </g>

  <!-- Scrollbar track -->
  <rect x="125" y="52" width="4" height="96" rx="2" fill="#e0e0e0" />

  <!-- Scrollbar thumb (active indicator) - positioned in the middle-upper area -->
  <rect x="125" y="70" width="4" height="24" rx="2" fill="url(#activeGrad)">
    <!-- Subtle animation: scroll indicator moves up and down -->
    <animate attributeName="y" values="70;110;70" dur="3s" repeatCount="indefinite" />
    <animate attributeName="height" values="24;20;24" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- TOC / sidebar link lines -->
  <g stroke-linecap="round">
    <!-- Inactive items (gray) -->
    <line x1="75" y1="62" x2="115" y2="62" stroke="#cbd5e0" stroke-width="3" />
    <line x1="75" y1="74" x2="105" y2="74" stroke="#cbd5e0" stroke-width="3" />

    <!-- Active item (highlighted with react cyan) -->
    <line x1="75" y1="86" x2="115" y2="86" stroke="url(#activeGrad)" stroke-width="3.5" />
    <!-- Active dot indicator -->
    <circle cx="71" cy="86" r="3.5" fill="#61DAFB">
      <animate attributeName="r" values="3.5;4.5;3.5" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- More inactive items -->
    <line x1="75" y1="98" x2="100" y2="98" stroke="#cbd5e0" stroke-width="3" />
    <line x1="75" y1="110" x2="110" y2="110" stroke="#cbd5e0" stroke-width="3" />
    <line x1="75" y1="122" x2="95" y2="122" stroke="#cbd5e0" stroke-width="3" />
    <line x1="75" y1="134" x2="108" y2="134" stroke="#cbd5e0" stroke-width="3" />
  </g>

  <!-- Hook bracket (representing React hook "use") -->
  <g transform="translate(40 90)" fill="none" stroke="#61DAFB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Left hook bracket shape: "use" hook concept -->
    <path d="M 10 0 L 0 0 L 0 20 L 10 20" />
    <path d="M 0 10 Q 5 10 5 15" />
  </g>
  <g transform="translate(150 90) scale(-1 1)" fill="none" stroke="#61DAFB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 10 0 L 0 0 L 0 20 L 10 20" />
    <path d="M 0 10 Q 5 10 5 15" />
  </g>
</svg>
